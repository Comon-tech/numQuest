<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>numQuest</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
	<link rel="stylesheet" href="./resources/css/style.css">
	<link rel="icon" type="image/x-icon" href="resources/images/numquest-logo.png">
	<script src="resources/js/index.js" defer type="module"></script>
	<script src="https://kit.fontawesome.com/b7218fa253.js" crossorigin="anonymous"></script>
</head>

<body class="bg-[#1a1a1a] text-white overflow-x-hidden">
	<!-- Mobile Navigation Buttons -->
	<div class="flex justify-between items-center p-4 lg:hidden">
		<button id="toggle-settings" type="button"
			class="inline-flex items-center p-2 text-sm text-gray-400 rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-600 transition-colors">
			<span class="sr-only">Open settings</span>
			<svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20"
				xmlns="http://www.w3.org/2000/svg">
				<path clip-rule="evenodd" fill-rule="evenodd"
					d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z">
				</path>
			</svg>
		</button>

		<button id="toggle-history" type="button"
			class="inline-flex items-center p-2 text-sm text-gray-400 rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-600 transition-colors">
			<span class="sr-only">Open History</span>
			<i class="text-2xl fa-solid fa-clock-rotate-left"></i>
		</button>
	</div>

	<!-- Left Sidebar - Game Settings -->
	<aside id="settings-sidebar" class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform duration-300 ease-in-out -translate-x-full 
	 lg:translate-x-0 bg-[#1a1a1a] border-r-2 border-gray-600" aria-label="Game Settings Sidebar">
		<div class="h-full px-3 py-4 overflow-y-auto">
			<ul class="space-y-4 font-medium">
				<li class="flex justify-center">
					<img src="resources/images/numquest-logo.png" class="w-28" alt="NumQuest Logo">
				</li>

				<li>
					<label class="text-white text-sm mb-2 block" for="range_">Number range:</label>
					<div class="p-3 border-2 border-gray-600 rounded-lg space-y-2">
						<input class="w-full border-gray-600 rounded-lg px-2 py-1 bg-gray-800 text-white focus:border-[#78b95f] focus:outline-none transition-colors" 
							type="number" id="range_" value="1" min="1" max="100">
						<input class="w-full border-gray-600 rounded-lg px-2 py-1 bg-gray-800 text-white focus:border-[#78b95f] focus:outline-none transition-colors" 
							type="number" id="range" value="10" min="1" max="100">
						<button class="w-full bg-[#78b95f] hover:bg-[#6aa84f] text-white font-semibold rounded-lg py-2 px-4 transition-all duration-300 hover:transform hover:-translate-y-0.5 hover:shadow-lg" 
							id="savesettings">Apply</button>
					</div>
				</li>

				<li>
					<div class="p-3 border-2 border-gray-600 rounded-lg space-y-3">
						<p class="text-center text-sm">Background Music</p>
						<div class="flex items-center justify-center space-x-4">
							<button id="toggleBgMusic" class="text-2xl text-[#78b95f] hover:text-[#6aa84f] transition-colors">
								<i class="fa-solid fa-shuffle"></i>
							</button>
							<button id="stopBgMusic" class="text-2xl text-red-500 hover:text-red-400 transition-colors">
								<i class="fa-solid fa-stop"></i>
							</button>
						</div>
						<div class="space-y-2">
							<p class="text-center text-sm">Volume</p>
							<div class="flex items-center space-x-2">
								<i class="fa-solid fa-volume-low text-gray-400"></i>
								<input class="flex-1 h-1.5 bg-gray-600 rounded-lg appearance-none cursor-pointer slider" type="range" id="volume" min="0" max="1" step="0.01" value="0.1">
								<i class="fa-solid fa-volume-high text-gray-400"></i>
							</div>
						</div>
					</div>
				</li>
			</ul>
		</div>
	</aside>

	<!-- Right Sidebar - Game History -->
	<aside id="history-sidebar" class="fixed top-0 right-0 z-40 w-64 h-screen transition-transform duration-300 ease-in-out translate-x-full 
	 lg:translate-x-0 bg-[#1a1a1a] border-l-2 border-gray-600" aria-label="Game History Sidebar">
		<div class="h-full px-3 py-4 overflow-y-auto">
			<div class="space-y-4">
				<div class="text-center">
					<h3 class="text-lg font-bold text-[#78b95f] mb-4">
						<i class="fa-solid fa-clock-rotate-left mr-2"></i>
						Game History
					</h3>
					<div class="space-y-2" id="history-scores">
						<!-- History items will be populated here -->
					</div>
				</div>
			</div>
		</div>
	</aside>

	<!-- Main Content -->
	<div class="p-4 lg:ml-64 lg:mr-64">
		<div class="max-w-6xl mx-auto">
			<!-- Game Stats -->
			<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
				<div class="bg-[#1a1a1a] border-2 border-gray-600 rounded-xl p-6 text-center transition-all duration-300 hover:border-[#78b95f] hover:transform hover:-translate-y-1">
					<h2 class="text-lg sm:text-xl font-bold mb-2">Score</h2>
					<p class="text-2xl sm:text-3xl font-bold text-[#78b95f] mb-2" id="score">100</p>
					<button class="mt-2 px-3 sm:px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white rounded-lg transition-colors text-sm sm:text-base" id="reset">
						Reset <i class="fa-solid fa-rotate-left ml-2"></i>
					</button>
				</div>

				<div class="bg-[#1a1a1a] border-2 border-gray-600 rounded-xl p-6 text-center transition-all duration-300 hover:border-[#78b95f] hover:transform hover:-translate-y-1">
					<h2 class="text-lg sm:text-xl font-bold mb-2">Time Left</h2>
					<p class="text-2xl sm:text-3xl font-bold text-[#78b95f]" id="timer">60s</p>
				</div>

				<div class="bg-[#1a1a1a] border-2 border-gray-600 rounded-xl p-6 text-center transition-all duration-300 hover:border-[#78b95f] hover:transform hover:-translate-y-1 sm:col-span-2 lg:col-span-1">
					<h2 class="text-lg sm:text-xl font-bold mb-2">Status</h2>
					<p class="text-base sm:text-lg" id="message">Ready to play!</p>
				</div>
			</div>

			<!-- Game Area -->
			<div class="bg-[#1a1a1a] border-2 border-gray-600 rounded-2xl p-8 text-center transition-all duration-300 hover:border-[#78b95f]">
				<div class="max-w-md mx-auto space-y-4 sm:space-y-6">
					<h1 class="font-['Press_Start_2P'] text-xl sm:text-2xl text-[#78b95f] drop-shadow-lg">Guess the Number!</h1>
					<p class="text-base sm:text-lg" id="game-instruction">Guess a number between 1 and 10</p>
					
					<div class="space-y-3 sm:space-y-4">
						<input class="w-full px-3 sm:px-4 py-2 sm:py-3 border-2 border-gray-600 rounded-lg bg-gray-800 text-white text-center text-base sm:text-lg focus:border-[#78b95f] focus:outline-none focus:ring-2 focus:ring-[#78b95f] focus:ring-opacity-20 transition-all duration-300" 
							type="number" id="guessInput" placeholder="Enter your guess" min="1" max="10">
						<button class="w-full px-4 sm:px-6 py-2 sm:py-3 bg-[#78b95f] hover:bg-[#6aa84f] text-white text-base sm:text-lg font-bold rounded-lg transition-all duration-300 hover:transform hover:-translate-y-1 hover:shadow-lg" 
							id="checkGuess">Guess!</button>
					</div>
					
					<p class="text-lg text-yellow-400" id="hint-message"></p>
				</div>
			</div>
		</div>
	</div>

	<!-- Audio element for background music -->
	<audio id="backgroundMusic" loop preload="metadata"></audio>

	<!-- Custom sidebar toggle script -->
	<script>
		// Sidebar toggle functionality
		document.addEventListener('DOMContentLoaded', function() {
			const toggleSettings = document.getElementById('toggle-settings');
			const toggleHistory = document.getElementById('toggle-history');
			const settingsSidebar = document.getElementById('settings-sidebar');
			const historySidebar = document.getElementById('history-sidebar');

			// Toggle settings sidebar
			toggleSettings.addEventListener('click', function() {
				settingsSidebar.classList.toggle('-translate-x-full');
			});

			// Toggle history sidebar
			toggleHistory.addEventListener('click', function() {
				historySidebar.classList.toggle('translate-x-full');
			});

			// Close sidebars when clicking outside (mobile only)
			document.addEventListener('click', function(event) {
				if (window.innerWidth < 1024) {
					if (!settingsSidebar.contains(event.target) && !toggleSettings.contains(event.target)) {
						settingsSidebar.classList.add('-translate-x-full');
					}
					if (!historySidebar.contains(event.target) && !toggleHistory.contains(event.target)) {
						historySidebar.classList.add('translate-x-full');
					}
				}
			});
		});
	</script>
</body>

</html>
