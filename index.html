<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NumQuest Multiplayer</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
	<link rel="stylesheet" href="./resources/css/style.css">
	<link rel="icon" type="image/x-icon" href="resources/images/numquest-logo.png">
	<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
	<script src="resources/js/multiplayer.js" defer type="module"></script>
	<script src="https://kit.fontawesome.com/b7218fa253.js" crossorigin="anonymous"></script>
</head>

<body class="bg-[#1a1a1a] text-white overflow-x-hidden">
	<!-- Player Join Screen -->
	<div id="player-join-screen" class="min-h-screen flex items-center justify-center p-4">
		<div class="bg-gray-800 rounded-2xl p-8 max-w-md w-full border-2 border-gray-600">
			<div class="text-center mb-8">
				<img src="resources/images/numquest-logo.png" class="w-32 mx-auto mb-4" alt="NumQuest Logo">
				<h1 class="font-['Press_Start_2P'] text-2xl text-[#78b95f] mb-2">NumQuest</h1>
				<p class="text-gray-400">Multiplayer Number Guessing Game</p>
			</div>
			
			<form id="player-join-form" class="space-y-6">
				<div>
					<label for="username-input" class="block text-sm font-medium mb-2">Username</label>
					<input type="text" id="username-input" 
						class="w-full px-4 py-3 bg-gray-700 border-2 border-gray-600 rounded-lg text-white focus:border-[#78b95f] focus:outline-none transition-colors"
						placeholder="Enter your username" required>
				</div>
				
				<div>
					<label for="avatar-select" class="block text-sm font-medium mb-2">Choose Avatar</label>
					<select id="avatar-select" 
						class="w-full px-4 py-3 bg-gray-700 border-2 border-gray-600 rounded-lg text-white focus:border-[#78b95f] focus:outline-none transition-colors">
						<option value="👤">👤 Player</option>
						<option value="🎮">🎮 Gamer</option>
						<option value="🚀">🚀 Rocket</option>
						<option value="🌟">🌟 Star</option>
						<option value="🔥">🔥 Fire</option>
						<option value="💎">💎 Diamond</option>
						<option value="🎯">🎯 Target</option>
						<option value="⚡">⚡ Lightning</option>
					</select>
				</div>
				
				<button type="submit" 
					class="w-full bg-[#78b95f] hover:bg-[#6aa84f] text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 hover:transform hover:-translate-y-1 hover:shadow-lg">
					Join Game
				</button>
			</form>
		</div>
	</div>

	<!-- Multiplayer Lobby -->
	<div id="multiplayer-lobby" class="min-h-screen p-4" style="display: none;">
		<div class="max-w-7xl mx-auto">
			<!-- Header -->
			<div class="text-center mb-8">
				<h1 class="font-['Press_Start_2P'] text-3xl text-[#78b95f] mb-4">🎮 NumQuest Multiplayer</h1>
				<p class="text-gray-400 text-lg">Challenge your friends in real-time number guessing battles!</p>
			</div>

			<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
				<!-- Create Room Section -->
				<div class="lg:col-span-1">
					<div class="bg-gray-800 rounded-2xl p-6 border-2 border-gray-600">
						<h2 class="text-xl font-bold mb-4 text-[#78b95f]">🏠 Create Room</h2>
						<form id="create-room-form" class="space-y-4">
							<div>
								<label for="game-mode-select" class="block text-sm font-medium mb-2">Game Mode</label>
								<select id="game-mode-select" 
									class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:border-[#78b95f] focus:outline-none">
									<option value="competitive">🏆 Competitive</option>
									<option value="team">👥 Team</option>
									<option value="cooperative">🤝 Cooperative</option>
									<option value="tournament">🏅 Tournament</option>
								</select>
							</div>
							
							<div>
								<label for="max-rounds-input" class="block text-sm font-medium mb-2">Max Rounds</label>
								<input type="number" id="max-rounds-input" value="3" min="1" max="10"
									class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:border-[#78b95f] focus:outline-none">
							</div>
							
							<div>
								<label for="time-limit-input" class="block text-sm font-medium mb-2">Time Limit (seconds)</label>
								<input type="number" id="time-limit-input" value="60" min="30" max="300"
									class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:border-[#78b95f] focus:outline-none">
							</div>
							
							<div class="grid grid-cols-2 gap-4">
								<div>
									<label for="min-range-input" class="block text-sm font-medium mb-2">Min Range</label>
									<input type="number" id="min-range-input" value="1" min="1" max="1000"
										class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:border-[#78b95f] focus:outline-none">
								</div>
								<div>
									<label for="max-range-input" class="block text-sm font-medium mb-2">Max Range</label>
									<input type="number" id="max-range-input" value="100" min="1" max="10000"
										class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:border-[#78b95f] focus:outline-none">
								</div>
							</div>
							
							<button type="submit" 
								class="w-full bg-[#78b95f] hover:bg-[#6aa84f] text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 hover:transform hover:-translate-y-1 hover:shadow-lg">
								Create Room
							</button>
						</form>
					</div>
				</div>

				<!-- Available Rooms -->
				<div class="lg:col-span-2">
					<div class="bg-gray-800 rounded-2xl p-6 border-2 border-gray-600">
						<h2 class="text-xl font-bold mb-4 text-[#78b95f]">🚪 Available Rooms</h2>
						<div id="room-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
							<!-- Rooms will be populated here -->
						</div>
					</div>
				</div>
			</div>

			<!-- Online Players -->
			<div class="mt-8">
				<div class="bg-gray-800 rounded-2xl p-6 border-2 border-gray-600">
					<h2 class="text-xl font-bold mb-4 text-[#78b95f]">👥 Online Players</h2>
					<div id="player-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
						<!-- Players will be populated here -->
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Game Room -->
	<div id="game-room" class="min-h-screen p-4" style="display: none;">
		<div class="max-w-7xl mx-auto">
			<!-- Room Header -->
			<div class="flex justify-between items-center mb-6">
				<h1 class="font-['Press_Start_2P'] text-2xl text-[#78b95f]">Game Room</h1>
				<button id="leave-room-btn" 
					class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition-colors">
					Leave Room
				</button>
			</div>

			<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
				<!-- Room Info -->
				<div class="lg:col-span-1">
					<div id="room-info">
						<!-- Room information will be populated here -->
					</div>
					
					<!-- Game Controls -->
					<div class="mt-6 bg-gray-800 rounded-2xl p-6 border-2 border-gray-600">
						<h3 class="text-lg font-bold mb-4 text-[#78b95f]">Game Controls</h3>
						<div class="space-y-4">
							<button id="start-game-btn" 
								class="w-full bg-[#78b95f] hover:bg-[#6aa84f] text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 hover:transform hover:-translate-y-1 hover:shadow-lg">
								Start Game
							</button>
							
							<button id="use-powerup-btn" 
								class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 hover:transform hover:-translate-y-1 hover:shadow-lg">
								Use Power-up
							</button>
						</div>
					</div>
				</div>

				<!-- Chat Section -->
				<div class="lg:col-span-2">
					<div class="bg-gray-800 rounded-2xl p-6 border-2 border-gray-600 h-96">
						<h3 class="text-lg font-bold mb-4 text-[#78b95f]">💬 Chat</h3>
						
						<!-- Chat Messages -->
						<div id="chat-container" class="h-64 overflow-y-auto mb-4 space-y-2">
							<!-- Chat messages will appear here -->
						</div>
						
						<!-- Chat Input -->
						<form id="chat-form" class="flex space-x-2">
							<input type="text" id="chat-input" 
								class="flex-1 px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:border-[#78b95f] focus:outline-none"
								placeholder="Type your message...">
							<button type="submit" 
								class="bg-[#78b95f] hover:bg-[#6aa84f] text-white px-4 py-2 rounded-lg transition-colors">
								Send
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Game Area -->
	<div id="game-area" class="min-h-screen p-4" style="display: none;">
		<div class="max-w-7xl mx-auto">
			<!-- Game Header -->
			<div class="text-center mb-8">
				<h1 class="font-['Press_Start_2P'] text-3xl text-[#78b95f] mb-4">🎯 Game in Progress</h1>
				<div class="text-2xl font-bold text-yellow-400" id="game-timer">60s</div>
			</div>

			<!-- Game Display -->
			<div id="game-display" class="mb-8">
				<!-- Player scores and game state will be displayed here -->
			</div>

			<!-- Game Input (for active players) -->
			<div id="game-input" class="max-w-md mx-auto">
				<div class="bg-gray-800 rounded-2xl p-8 border-2 border-gray-600 text-center">
					<h2 class="text-xl font-bold mb-4">Make Your Guess!</h2>
					<div class="space-y-4">
						<input type="number" id="multiplayer-guess-input" 
							class="w-full px-4 py-3 border-2 border-gray-600 rounded-lg bg-gray-700 text-white text-center text-lg focus:border-[#78b95f] focus:outline-none focus:ring-2 focus:ring-[#78b95f] focus:ring-opacity-20 transition-all duration-300"
							placeholder="Enter your guess" min="1">
						<button id="submit-guess-btn" 
							class="w-full bg-[#78b95f] hover:bg-[#6aa84f] text-white text-lg font-bold py-3 px-6 rounded-lg transition-all duration-300 hover:transform hover:-translate-y-1 hover:shadow-lg">
							Submit Guess
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Results Modal Container -->
	<div id="results-modal"></div>

	<!-- Audio element for background music -->
	<audio id="backgroundMusic" loop preload="metadata"></audio>

	<!-- Initialize Multiplayer -->
	<script type="module">
		import { MultiplayerManager } from './resources/js/multiplayer.js';
		
		document.addEventListener('DOMContentLoaded', function() {
			window.multiplayerManager = new MultiplayerManager();
			
			// Setup guess submission
			const submitGuessBtn = document.getElementById('submit-guess-btn');
			const guessInput = document.getElementById('multiplayer-guess-input');
			
			if (submitGuessBtn && guessInput) {
				submitGuessBtn.addEventListener('click', () => {
					const guess = parseInt(guessInput.value);
					if (guess && window.multiplayerManager) {
						window.multiplayerManager.submitGuess(guess);
						guessInput.value = '';
					}
				});
				
				guessInput.addEventListener('keypress', (e) => {
					if (e.key === 'Enter') {
						submitGuessBtn.click();
					}
				});
			}
		});
	</script>
</body>

</html>
